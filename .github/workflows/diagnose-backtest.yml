name: diagnose-keiba-backtest
on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    paths:
      - 'scripts/diagnose_backtest.py'
      - '.github/workflows/diagnose-backtest.yml'
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}
jobs:
  diagnose:
    if: ${{ github.event_name != 'issues' || startsWith(github.event.issue.title, 'DIAGNOSE') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run strict chronological diagnostics
        run: python scripts/diagnose_backtest.py --test-year 2026 --min-ev 1.20 --min-odds 3.0
