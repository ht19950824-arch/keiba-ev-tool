name: update-keiba-data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Collect JRA indexes
        run: |
          for y in 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            python scripts/collect_jra_index.py --year $y
            sleep 1
          done
      - name: Commit index cache
        run: |
          git config user.name keiba-ev-bot
          git config user.email actions@users.noreply.github.com
          git add data/processed
          git diff --cached --quiet || git commit -m "update JRA index cache"
          git push
