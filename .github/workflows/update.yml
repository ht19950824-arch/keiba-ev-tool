name: update-keiba-data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 5'
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Update current-year data
        run: |
          YEAR=$(date -u +%Y)
          python scripts/collect_current_entries.py --out data/processed/current_entry_links.json
          python scripts/discover_jra_pdfs.py --year "$YEAR" --sleep 0.15
          python scripts/download_jra_pdfs.py --year "$YEAR" --index-dir data/processed --out data/raw --sleep 0.15
          python scripts/ingest_pdfs.py --year "$YEAR"
      - name: Train and publish
        run: |
          YEAR=$(date -u +%Y)
          if [ -f "data/processed/runners_$YEAR.parquet" ]; then
            python scripts/train_walkforward.py --test-year "$YEAR" --public-dir web/data
          fi
      - name: Commit derived data
        run: |
          git config user.name keiba-ev-bot
          git config user.email actions@users.noreply.github.com
          git add data/processed/jra_*_pdfs.json data/processed/backtest_*.json web/data
          git diff --cached --quiet || git commit -m "update JRA data and model results"
          git push
