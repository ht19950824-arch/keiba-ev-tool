name: bootstrap-keiba-history
# auto-rerun after pipeline fix
on:
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    - cron: '15 7 * * *'   # 16:15 JST
    - cron: '15 18 * * *'  # 03:15 JST
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'scripts/**'
      - 'app/**'
permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

concurrency:
  group: keiba-bootstrap-final
  cancel-in-progress: true

jobs:
  collect:
    if: ${{ github.event_name != 'issues' || startsWith(github.event.issue.title, 'BOOTSTRAP') }}
    strategy:
      fail-fast: false
      matrix:
        year: [2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect and ingest
        continue-on-error: true
        run: |
          set -e
          YEAR=${{ matrix.year }}
          python scripts/discover_jra_pdfs.py --year "$YEAR" --sleep 0
          python scripts/download_jra_pdfs.py --year "$YEAR" --index-dir data/processed --out data/raw --sleep 0.15
          python scripts/ingest_pdfs.py --year "$YEAR"
          test -f "data/processed/runners_$YEAR.parquet"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processed-${{ matrix.year }}
          path: |
            data/processed/runners_${{ matrix.year }}.parquet
            data/processed/jra_${{ matrix.year }}_pdfs.json
          if-no-files-found: ignore
          retention-days: 7

  assemble:
    if: ${{ always() }}
    needs: collect
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: processed-*
          path: data/processed
          merge-multiple: true
      - name: Restore only missing historical parquet files
        run: |
          set -e
          for YEAR in 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            FILE="data/processed/runners_${YEAR}.parquet"
            if [ ! -s "$FILE" ]; then
              git show 34edaeeda9f005685eb594598be06d6fd90387c6:"$FILE" > "$FILE"
            fi
          done
      - name: Verify processed history
        run: |
          set -e
          for YEAR in 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            test -s "data/processed/runners_$YEAR.parquet"
          done
          ls -lh data/processed/runners_*.parquet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/collect_current_entries.py --out data/processed/current_entries.json
      - name: Verify current entries
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/processed/current_entries.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          races=data.get("races", [])
          rows=sum(len(r.get("rows", [])) for r in races)
          print(f"current_races={len(races)} current_rows={rows}")
          if not races or rows == 0:
              print("No current JRA entries are published yet; keeping current prediction output empty.")
          PY
      - run: python scripts/train_walkforward.py --test-year 2026 --public-dir web/data
      - run: python scripts/predict_current.py --entries data/processed/current_entries.json --model data/processed/model/model.joblib --history-glob "data/processed/runners_*.parquet" --out web/data/current_predictions.json
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-model
          path: data/processed/model
          retention-days: 7
      - name: Commit processed history and web data
        run: |
          git config user.name keiba-ev-bot
          git config user.email actions@users.noreply.github.com
          git add data/processed/*.parquet data/processed/jra_*_pdfs.json data/processed/current_entries.json web/data
          git diff --cached --quiet || git commit -m "bootstrap JRA history and walk-forward results"
          git push
