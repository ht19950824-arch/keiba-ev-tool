name: bootstrap-keiba-history
# Re-run bootstrap after data pipeline fixes
# Parser validation pass
# Final parser retry
# Add parser smoke diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'scripts/**'
      - 'app/**'
permissions: {contents: write}

env:
  PYTHONPATH: ${{ github.workspace }}
concurrency:
  group: keiba-bootstrap
  cancel-in-progress: true
jobs:
  smoke-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pdfplumber
      - run: |
          curl -L --retry 3 -o /tmp/sample.pdf https://www.jra.go.jp/datafile/seiseki/report/2026/2026-2chukyo5.pdf
          python - <<'PY'
          import pdfplumber
          with pdfplumber.open("/tmp/sample.pdf") as pdf:
              text = pdf.pages[0].extract_text() or ""
              print("\n--- PDFPLUMBER SAMPLE START ---")
              print(text[:5000])
              print("--- PDFPLUMBER SAMPLE END ---")
          PY
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        year: [2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/discover_jra_pdfs.py --year ${{ matrix.year }} --sleep 0
      - run: python scripts/download_jra_pdfs.py --year ${{ matrix.year }} --index-dir data/processed --out data/raw --sleep 0.15
      - run: python scripts/ingest_pdfs.py --year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        with:
          name: processed-${{ matrix.year }}
          path: |
            data/processed/runners_${{ matrix.year }}.parquet
            data/processed/jra_${{ matrix.year }}_pdfs.json
          retention-days: 7
  assemble:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: processed-*
          path: data/processed/artifacts
          merge-multiple: true
      - name: Normalize downloaded artifacts
        run: |
          find data/processed/artifacts -type f -name 'runners_*.parquet' -exec cp {} data/processed/ \;
          find data/processed/artifacts -type f -name 'jra_*_pdfs.json' -exec cp {} data/processed/ \;
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/collect_current_entries.py --out data/processed/current_entries.json
      - run: python scripts/train_walkforward.py --test-year 2026 --public-dir web/data
      - run: python scripts/predict_current.py --entries data/processed/current_entries.json --model data/processed/model/model.joblib --history-glob "data/processed/runners_*.parquet" --out web/data/current_predictions.json
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-model
          path: data/processed/model
          retention-days: 7
      - name: Commit processed history and web data
        run: |
          git config user.name keiba-ev-bot
          git config user.email actions@users.noreply.github.com
          git add data/processed/*.parquet data/processed/jra_*_pdfs.json data/processed/current_entries.json web/data
          git diff --cached --quiet || git commit -m "bootstrap JRA history and walk-forward results"
          git push
