name: refresh-current-keiba

on:
  workflow_dispatch:
  schedule:
    # Check the JRA entry pages every 30 minutes from Thu/Fri 09:00-21:00 JST.
    - cron: "*/30 0-12 * * 4,5"
  push:
    paths:
      - ".github/workflows/refresh-current.yml"

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

concurrency:
  group: keiba-current-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m compileall -q app scripts
          pytest -q
      - name: Fetch current JRA entries
        run: python scripts/collect_current_entries.py --out data/processed/current_entries.json
      - name: Stop cleanly when entries are not published
        id: gate
        run: |
          python - <<'PY'
          import json, os
          d=json.load(open("data/processed/current_entries.json",encoding="utf-8"))
          published=bool(d.get("races")) and sum(len(r.get("rows",[])) for r in d.get("races",[]))>0
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("published="+("true" if published else "false")+"\n")
          print("published=",published)
          PY
      - name: Train and predict current races
        if: steps.gate.outputs.published == 'true'
        run: |
          python scripts/train_walkforward.py --test-year 2026 --public-dir web/data
          test -f data/processed/model/model.joblib
          python scripts/predict_current.py             --entries data/processed/current_entries.json             --model data/processed/model/model.joblib             --history-glob "data/processed/runners_*.parquet"             --out web/data/current_predictions.json
      - name: Keep public data empty before publication
        if: steps.gate.outputs.published != 'true'
        run: echo '[]' > web/data/current_predictions.json
      - name: Validate generated prediction JSON
        if: steps.gate.outputs.published == 'true'
        run: |
          python - <<'PY'
          import json
          p=json.load(open("web/data/current_predictions.json",encoding="utf-8"))
          assert isinstance(p,list) and p, "published entries produced no predictions"
          for r in p:
              assert r.get("horse") and r.get("race_key")
              assert 0 <= float(r["model_win_prob"]) <= 1
              assert float(r["odds"]) > 0
          print("validated",len(p),"predictions")
          PY
      - name: Publish refreshed data
        run: |
          git config user.name keiba-ev-bot
          git config user.email actions@users.noreply.github.com
          git add data/processed/current_entries.json web/data
          git diff --cached --quiet || git commit -m "refresh current JRA entries and predictions"
          git pull --rebase origin main
          git push
